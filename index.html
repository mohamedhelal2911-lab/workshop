  import { getDatabase, ref, set, onValue } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

  const firebaseConfig = {
    apiKey: "AIzaSyATpe71Xtbyei5n-CP8cYRHrHCJpJMUiI4",
    authDomain: "work-shop-7c2a6.firebaseapp.com",
    databaseURL: "https://work-shop-7c2a6-default-rtdb.firebaseio.com",
    projectId: "work-shop-7c2a6",
    storageBucket: "work-shop-7c2a6.firebasestorage.app",
    messagingSenderId: "1081213210490",
    appId: "1:1081213210490:web:dfeac94c4741d5c53850c3",
    measurementId: "G-TCZVSKBZKS"
  };

  try{
    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    window.firebaseReady = true;

    window.cloudSave = function(data){
      try{
        set(ref(db, 'workshop_full_database_v12'), data).then(()=>{
          window.cloudStatus = "online";
          if(window.updateConnIndicator) window.updateConnIndicator();
        }).catch(err=>{
          console.error("Firebase save error", err);
          window.cloudStatus = "offline";
          if(window.updateConnIndicator) window.updateConnIndicator();
        });
      }catch(e){ console.error(e); }
    };

    onValue(ref(db, 'workshop_full_database_v12'), (snapshot) => {
      const val = snapshot.val();
      window.cloudStatus = "online";
      if(window.updateConnIndicator) window.updateConnIndicator();
      if(val && window.onCloudDataReceived){
        window.onCloudDataReceived(val);
      } else if(!val){
        window.onCloudDataReceived({buses:[],supplyRequests:[],stockAdditions:[],settings:{managerEmail:""},meta:{deletedFaultIds:{}}}, true);
      }
    }, (err)=>{
      console.error("Firebase read error", err);
      window.cloudStatus = "offline";
      if(window.updateConnIndicator) window.updateConnIndicator();
    });
  }catch(e){
    console.error("Firebase init failed", e);
    window.firebaseReady = false;
    window.cloudStatus = "offline";
  }
</script>

if ("serviceWorker" in navigator) {

/* ===================== ثوابت ===================== */
const DEPARTMENTS = ["سمكرة","دهان","كهرباء","كاوتش","زجاج"];
const ACCOUNTS = [
  {username:"admin",password:"admin123",role:"admin",label:"مدير الورشة"},
  {username:"inspection",password:"insp123",role:"inspection",label:"قسم التفتيش"},
  {username:"insp1",password:"insp1123",role:"inspection",label:"المفتش الأول",inspector:true},

  {username:"amin",password:"amin123",role:"custodian",label:"أمين العهدة"},
];
const FAULT_STATUS = {PENDING_APPROVAL:"بانتظار اعتماد المدير", PENDING:"بانتظار البدء", IN_PROGRESS:"جاري العمل", DONE:"مكتمل"};
const BUS_STATUS = {PENDING_APPROVAL:"بانتظار اعتماد مهام الإصلاح", INSPECT:"قيد الفحص", REPAIR:"قيد الإصلاح", READY:"جاهز للتسليم", DELIVERED:"تم التسليم"};
const MAX_PHOTOS = 6;
const DB_KEY = "workshop-offline-db-v1";
const DEVICE_KEY = "workshop-device-name-v1";
const SESSION_KEY = "workshop-login-session-v1";
const SUPPLY_ITEMS = ["كاوتش","معجون استوك","دهان أبيض","دهان أزرق","دهان لبني","معجون فايبر"];
const SUPPLY_STATUS = { PENDING:"بانتظار موافقة المدير", REJECTED:"مرفوض", APPROVED:"تمت الموافقة — بانتظار الصرف", DISPENSED:"تم الصرف" };

/* ===================== أدوات ===================== */
const uid = (p="id") => p+"-"+Date.now()+"-"+Math.random().toString(36).slice(2,8);
const nowISO = () => new Date().toISOString();
function touch(obj){ if(obj) obj.updatedAt = nowISO(); return obj; }
const EGYPT_TZ = "Africa/Cairo";
const fmtDateTime = (iso) => iso ? new Date(iso).toLocaleString("ar-EG",{dateStyle:"medium",timeStyle:"short",timeZone:EGYPT_TZ}) : "—";
function localDateTimeInputValue(date=new Date()){
  const parts = new Intl.DateTimeFormat("en-CA",{timeZone:EGYPT_TZ,year:"numeric",month:"2-digit",day:"2-digit",hour:"2-digit",minute:"2-digit",hourCycle:"h23"}).formatToParts(date);
  const v = Object.fromEntries(parts.map(p=>[p.type,p.value]));
  return `${v.year}-${v.month}-${v.day}T${v.hour}:${v.minute}`;
}
function egyptDateString(date=new Date()){
  const parts = new Intl.DateTimeFormat("en-CA",{timeZone:EGYPT_TZ,year:"numeric",month:"2-digit",day:"2-digit"}).formatToParts(date);
  const v = Object.fromEntries(parts.map(p=>[p.type,p.value]));
  return `${v.year}-${v.month}-${v.day}`;
}
function saveLoginSession(){

function restoreLoginSession(){

    const saved=JSON.parse(localStorage.getItem(SESSION_KEY)||"null");
    if(!saved || !saved.username) return;
    const acc=ACCOUNTS.find(a=>a.username===saved.username);
    if(!acc) return;
    currentUser=acc;
    const tabs=tabsFor(acc.role);
    route=tabs.some(t=>t.id===saved.route)?saved.route:tabs[0].id;

}
function getDeviceName(){ try{ return localStorage.getItem(DEVICE_KEY) || ""; }catch(e){ return ""; } }
function setDeviceName(v){ try{ localStorage.setItem(DEVICE_KEY, (v||"").trim()); }catch(e){} }
const fmtMoney = (n) => (Number(n)||0).toLocaleString("ar-EG",{maximumFractionDigits:2}) + " ج.م";
const esc = (s) => String(s ?? "").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");

function compressImage(file, maxWidth=640, quality=0.55){
  return new Promise((resolve,reject)=>{
    const reader = new FileReader();
    reader.onerror = () => reject(new Error("تعذرت قراءة الملف"));
    reader.onload = () => {
      const img = new Image();
      img.onload = () => {
        const scale = Math.min(1, maxWidth/img.width);
        const canvas = document.createElement("canvas");
        canvas.width = Math.round(img.width*scale);
        canvas.height = Math.round(img.height*scale);
        const ctx = canvas.getContext("2d");
        ctx.drawImage(img,0,0,canvas.width,canvas.height);
        resolve(canvas.toDataURL("image/jpeg",quality));
      };
      img.onerror = () => reject(new Error("تعذر تحميل الصورة"));
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  });
}

function faultTotal(f){
  const parts = (f.spareParts||[]).reduce((s,p)=>s+(Number(p.price)||0)*(Number(p.qty)||1),0);
  const mats = (f.materials||[]).reduce((s,m)=>s+(Number(m.price)||0)*(Number(m.qty)||1),0);
  return parts + mats + (Number(f.laborCost)||0);
}
function computeBusStatus(bus){
  if(bus.delivery) return BUS_STATUS.DELIVERED;
  if(!bus.faults || bus.faults.length===0) return BUS_STATUS.INSPECT;
  if(bus.faults.some(f=>f.status===FAULT_STATUS.PENDING_APPROVAL)) return BUS_STATUS.PENDING_APPROVAL;
  if(bus.faults.every(f=>f.status===FAULT_STATUS.DONE)) return BUS_STATUS.READY;
  return BUS_STATUS.REPAIR;
}
function busDepts(bus){ return [...new Set((bus.faults||[]).map(f=>f.department))]; }
function busTotalCost(bus){ return (bus.faults||[]).reduce((s,f)=>s+faultTotal(f),0); }

function statusColors(status){
  const map = {
    [BUS_STATUS.PENDING_APPROVAL]: ["#C77DFF","#2E1F3A"],
    [BUS_STATUS.INSPECT]: ["#98A2AE","#2A2F35"], [BUS_STATUS.REPAIR]: ["#F2A93B","#3A2E17"],
    [BUS_STATUS.READY]: ["#4C8BF5","#182A45"], [BUS_STATUS.DELIVERED]: ["#3FCF8E","#123A2C"],
    [FAULT_STATUS.PENDING_APPROVAL]: ["#C77DFF","#2E1F3A"], [FAULT_STATUS.PENDING]: ["#98A2AE","#2A2F35"],
    [FAULT_STATUS.IN_PROGRESS]: ["#F2A93B","#3A2E17"], [FAULT_STATUS.DONE]: ["#3FCF8E","#123A2C"],
  };
  return map[status] || ["#98A2AE","#2A2F35"];
}
function badge(status){
  const [c,bg] = statusColors(status);
  return `<span class="badge" style="color:${c};background:${bg}">${esc(status)}</span>`;
}
function supplyStatusColor(status){
  if(status===SUPPLY_STATUS.PENDING) return ["#F2A93B","#3A2E17"];
  if(status===SUPPLY_STATUS.REJECTED) return ["#EF5B5B","#3A1717"];
  if(status===SUPPLY_STATUS.APPROVED) return ["#4C8BF5","#182A45"];
  if(status===SUPPLY_STATUS.DISPENSED) return ["#3FCF8E","#123A2C"];
  return ["#98A2AE","#2A2F35"];
}

/* ===================== قاعدة البيانات ===================== */
function normalizeDB(db){
  db = db || {};
  if(!db.buses) db.buses = [];
  if(!db.supplyRequests) db.supplyRequests = [];
  if(!db.stockAdditions) db.stockAdditions = [];
  if(!db.settings) db.settings = {managerEmail:""};
  if(!db.meta) db.meta = {deletedFaultIds:{}};
  if(!db.meta.deletedFaultIds) db.meta.deletedFaultIds = {};
  return db;
}
let DB = normalizeDB({});
let lastCloudJson = "";
let cloudReceivedOnce = false;

/* IndexedDB helpers */
const IDB_SUPPORTED = ('indexedDB' in window);
function mainIdbOpen(){
  return new Promise((resolve,reject)=>{
    const req = indexedDB.open("workshop-main-db", 1);
    req.onupgradeneeded = () => { if(!req.result.objectStoreNames.contains("kv")) req.result.createObjectStore("kv"); };
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}
function idbGetDB(){
  return mainIdbOpen().then(db => new Promise((resolve,reject)=>{
    const tx = db.transaction("kv","readonly");
    const req = tx.objectStore("kv").get("db");
    req.onsuccess = () => resolve(req.result || null);
    req.onerror = () => reject(req.error);
  }));
}
function idbPutDB(value){
  return mainIdbOpen().then(db => new Promise((resolve,reject)=>{
    const tx = db.transaction("kv","readwrite");
    tx.objectStore("kv").put(value, "db");
    tx.oncomplete = () => resolve(true);
    tx.onerror = () => reject(tx.error);
  }));
}
async function loadLocalDB(){
  // ابدأ بالنسخة المتزامنة في localStorage حتى لا تضيع آخر إضافة عند تحديث الصفحة بسرعة.
  // ثم استخدم IndexedDB كنسخة محلية إضافية/احتياطية.
  try{
    const raw = localStorage.getItem(DB_KEY);
    if(raw){
      const localCopy = normalizeDB(JSON.parse(raw));
      if(IDB_SUPPORTED) idbPutDB(localCopy).catch(e=>console.error("IDB backup restore failed", e));
      return localCopy;
    }
  }catch(e){ console.error("localStorage read failed", e); }
  if(IDB_SUPPORTED){
    try{
      const existing = await idbGetDB();
      if(existing){
        const normalized = normalizeDB(existing);
        try{ localStorage.setItem(DB_KEY, JSON.stringify(normalized)); }catch(e){}
        return normalized;
      }
    }catch(e){ console.error("IndexedDB read failed", e); }
  }
  return normalizeDB({});
}

/* حفظ محلي متزامن + IndexedDB + Firebase */
let dbWriteQueue = Promise.resolve();
function saveDB(db){
  DB = normalizeDB(db);
  // localStorage يكتب بشكل متزامن، فيقل احتمال ضياع آخر تسجيل عند Refresh سريع.
  try{ localStorage.setItem(DB_KEY, JSON.stringify(DB)); }
  catch(e){ console.error("localStorage save failed", e); }
  // IndexedDB نسخة محلية إضافية، مع تسلسل عمليات الكتابة.
  if(IDB_SUPPORTED){
    const snapshot = JSON.parse(JSON.stringify(DB));
    dbWriteQueue = dbWriteQueue.then(()=>idbPutDB(snapshot)).catch(e=>console.error("IDB save failed", e));
  }
  // حفظ سحابي إذا كان Firebase متصلًا ومهيأً.
  if(window.cloudSave){
    lastCloudJson = JSON.stringify(DB);
    window.cloudSave(DB);
  }
  return true;
}

/* استقبال بيانات من Firebase */
window.onCloudDataReceived = function(remoteData, isFirstEmpty){
  if(!remoteData) return;
  const remoteJson = JSON.stringify(remoteData);
  if(remoteJson === lastCloudJson) return; // تجاهل لو نفس البيانات
  // لو أول مرة والمحلي فيه بيانات — نعمل merge يدوي بسيط (الأحدث يفوز)
  if(!cloudReceivedOnce){
    cloudReceivedOnce = true;
    const hasRemote = remoteData.buses && remoteData.buses.length > 0;
    const hasLocal = DB.buses && DB.buses.length > 0;
    if(hasRemote && hasLocal){
      const {merged} = mergeDB(DB, remoteData);
      DB = merged;
      lastCloudJson = JSON.stringify(DB);
      if(window.cloudSave) window.cloudSave(DB);
      render();
      return;
    }
    if(!hasRemote && hasLocal){
      // ارفع المحلي للسحابة
      lastCloudJson = JSON.stringify(DB);
      if(window.cloudSave) window.cloudSave(DB);
      render();
      return;
    }
  }
  DB = normalizeDB(remoteData);
  lastCloudJson = remoteJson;
  try{ localStorage.setItem(DB_KEY, JSON.stringify(DB)); }catch(e){ console.error("localStorage cloud-cache save failed", e); }
  if(IDB_SUPPORTED) idbPutDB(JSON.parse(JSON.stringify(DB))).catch(e=>console.error("IDB cloud-cache save failed", e));
  render();
};

function buildRoute(){

  let body = "";

  else if(route==="queue" && currentUser.role==="admin") body = buildAdminQueue();
  else if(route==="supplies" && currentUser.role==="admin") body = buildSuppliesAdmin();
  else if(route==="approvals" && currentUser.role==="admin") body = buildApprovalsAdmin();
  else if(route==="supplyrequest" && isDept) body = buildSupplyRequestForm();

function syncDraftBusFromDOM(){
  if(!draftBus) return;
  const g = id => document.getElementById(id);
  if(g("nb-busNumber")) draftBus.busNumber = g("nb-busNumber").value;
  if(g("nb-driverName")) draftBus.driverName = g("nb-driverName").value;
  if(g("nb-driverCode")) draftBus.driverCode = g("nb-driverCode").value;
  if(g("nb-inspectorName")) draftBus.inspectorName = g("nb-inspectorName").value;
  if(g("nb-inspectionDate")) draftBus.inspectionDate = g("nb-inspectionDate").value;
  draftBus.faults.forEach((f,i)=>{
    if(g("nb-f-desc-"+i)) f.description = g("nb-f-desc-"+i).value;
    if(g("nb-f-dept-"+i)) f.department = g("nb-f-dept-"+i).value;

}
function nbSetNow(){ const el=document.getElementById("nb-inspectionDate"); if(el) el.value = localDateTimeInputValue(); }

async function nbAddPhotos(i, input){
  syncDraftBusFromDOM();

  const files = Array.from(input.files||[]).slice(0, MAX_PHOTOS-f.photosBefore.length);
  for(const file of files){ try{ f.photosBefore.push(await compressImage(file)); }catch(e){} }

}

function renderNewBusOnly(){ const el = document.getElementById("newbus-root"); if(el) el.outerHTML = buildNewBus(); }

function submitNewBus(){
  syncDraftBusFromDOM();
  const d = draftBus;
  if(!d.busNumber.trim() || !d.driverName.trim() || !d.inspectorName.trim()){ d.msg="err:يرجى إكمال بيانات السائق والأتوبيس والمفتش"; renderNewBusOnly(); return; }
  if(d.faults.some(f=>!f.description.trim())){ d.msg="err:يرجى كتابة وصف لكل مهمة إصلاح مضافة"; renderNewBusOnly(); return; }
  const receivedAt = new Date(d.inspectionDate).toISOString();
  const autoApprove = currentUser.role==="admin";
  const stamp = nowISO();
  const bus = {
    id: uid("bus"), busNumber:d.busNumber.trim(), driverName:d.driverName.trim(), driverCode:d.driverCode.trim(),
    inspectionDate: receivedAt, inspectorName: d.inspectorName.trim(),
    faults: d.faults.map(f=>({...f, receivedDate: receivedAt, createdBy: currentUser.label,
      status: autoApprove ? FAULT_STATUS.PENDING : FAULT_STATUS.PENDING_APPROVAL,
      approvedBy: autoApprove ? currentUser.label : "", approvedAt: autoApprove ? nowISO() : null, updatedAt: stamp})),
    delivery: null, updatedAt: stamp,
  };
  DB.buses.push(bus);
  if(!saveDB(DB)) return;
  if(!autoApprove) notifyManagerNewBusPending(bus);
  resetDraftBus();
  draftBus.msg = autoApprove ? "ok:تم تسجيل الأتوبيس بنجاح ✓" : "ok:تم إرسال الأتوبيس ومهام الإصلاح للمدير، بانتظار الاعتماد ✓";
  renderNewBusOnly();
}

  }catch(e){}
}

function buildFaultApprovalCard(bus, f){
  return `
  <div class="panel2 rounded p3 col gap2">
    <div class="row between center"><span class="txt-xs sub">مقترح من: ${esc(f.createdBy||"—")} · ${fmtDateTime(f.receivedDate)}</span>${badge(f.status)}</div>
    <label class="field"><span>وصف المهمة</span><textarea id="ap-desc-${f.id}" class="input" rows="2">${esc(f.description)}</textarea></label>
    <label class="field"><span>القسم</span>
      <select id="ap-dept-${f.id}" class="input">${DEPARTMENTS.map(dp=>`<option value="${dp}" ${f.department===dp?"selected":""}>${dp}</option>`).join("")}</select>
    </label>
    ${f.photosBefore.length?`<div class="row wrap gap1">${f.photosBefore.map(p=>`<img src="${p}" class="thumb-sm"/>`).join("")}</div>`:""}
    <div class="row gap2">
      <button class="btn btn-primary" onclick="approveFault('${bus.id}','${f.id}')">✔ اعتماد</button>
      <button class="btn btn-danger" onclick="rejectFault('${bus.id}','${f.id}')">✘ رفض</button>
    </div>
  </div>`;
}
function renderApprovalsOnly(){ const el = document.getElementById("approvals-root"); if(el) el.outerHTML = buildApprovalsAdmin(); }
function approveFault(busId, faultId){
  const bus = DB.buses.find(b=>b.id===busId); if(!bus) return;
  const f = bus.faults.find(x=>x.id===faultId); if(!f) return;
  const descEl = document.getElementById("ap-desc-"+faultId);
  const deptEl = document.getElementById("ap-dept-"+faultId);
  if(descEl && descEl.value.trim()) f.description = descEl.value.trim();
  if(deptEl) f.department = deptEl.value;
  f.status = FAULT_STATUS.PENDING;
  f.approvedBy = currentUser.label; f.approvedAt = nowISO();
  touch(f); touch(bus);
  if(!saveDB(DB)) return;
  renderApprovalsOnly();
}
function rejectFault(busId, faultId){
  if(!confirm("هل تريد حذف/رفض هذه المهمة؟")) return;
  const bus = DB.buses.find(b=>b.id===busId); if(!bus) return;
  bus.faults = bus.faults.filter(f=>f.id!==faultId);
  DB.meta.deletedFaultIds[faultId] = nowISO();
  touch(bus);
  if(!saveDB(DB)) return;
  renderApprovalsOnly();
}
function adminDeleteFault(busId, faultId){
  if(currentUser.role!=="admin") return;
  const bus = DB.buses.find(b=>b.id===busId); if(!bus) return;
  const f = bus.faults.find(x=>x.id===faultId); if(!f) return;
  if(!confirm(`هل أنت متأكد من حذف هذه المهمة نهائيًا؟\n"${f.description}"`)) return;
  bus.faults = bus.faults.filter(x=>x.id!==faultId);
  DB.meta.deletedFaultIds[faultId] = nowISO();
  touch(bus);
  if(!saveDB(DB)) return;
  if(openTask && openTask.faultId===faultId){ openTask=null; workDraft=null; }
  render();
}
function addApprovedFaultToBus(busId){
  const bus = DB.buses.find(b=>b.id===busId); if(!bus) return;
  const descEl = document.getElementById("apn-desc-"+busId);
  const deptEl = document.getElementById("apn-dept-"+busId);
  const desc = descEl ? descEl.value.trim() : "";
  if(!desc){ alert("يرجى كتابة وصف المهمة"); return; }
  const f = emptyFault();
  f.description = desc; f.department = deptEl ? deptEl.value : DEPARTMENTS[0];
  f.receivedDate = nowISO(); f.status = FAULT_STATUS.PENDING;
  f.createdBy = currentUser.label; f.approvedBy = currentUser.label; f.approvedAt = nowISO();
  touch(f); bus.faults.push(f); touch(bus);
  if(!saveDB(DB)) return;
  renderApprovalsOnly();
}

function buildQueue(dept){
  return `<div id="queue-root">${buildQueueInner(dept)}</div>`;
}
function buildAdminQueue(){
  return `<div class="max-w col gap3">

function setQueueFilter(v){ deptQueueFilter = v; render(); }
function currentQueueDept(){ return currentUser.role==="admin" ? adminQueueDept : currentUser.role; }
function collectDeptTasks(dept){
  const tasks = [];
  DB.buses.forEach(b=>b.faults.forEach(f=>{ if(f.department===dept && f.status!==FAULT_STATUS.PENDING_APPROVAL) tasks.push({bus:b,fault:f}); }));
  return tasks;
}
function queueSetSearch(v){
  queueSearch = v;
  const el = document.getElementById("queue-results");
  if(el) el.outerHTML = buildQueueResults(collectDeptTasks(currentQueueDept()));
}
function buildQueueResults(tasks){
  const shown = tasks.filter(t=>
    (deptQueueFilter==="الكل" || (deptQueueFilter==="نشطة" ? t.fault.status!==FAULT_STATUS.DONE : t.fault.status===FAULT_STATUS.DONE))
    && (!queueSearch || t.bus.busNumber.includes(queueSearch) || t.bus.driverName.includes(queueSearch)));
  shown.sort((a,b)=> new Date(b.fault.receivedDate)-new Date(a.fault.receivedDate));
  if(shown.length===0) return `<div id="queue-results"><p class="txt-sm sub" style="text-align:center;padding:30px 0;">لا توجد مهام مطابقة</p></div>`;
  return `<div id="queue-results" class="col gap2">
      ${shown.map(t=>`<div class="card-btn" onclick="openTask={busId:'${t.bus.id}',faultId:'${t.fault.id}'};workDraft=null;render();">
        <div><div class="txt-sm bold">أتوبيس ${esc(t.bus.busNumber)} — ${esc(t.bus.driverName)}</div>
        <div class="txt-xs sub" style="margin-top:2px;">${esc(t.fault.description)}</div>
        <div class="txt-xs sub" style="margin-top:2px;">استلام: ${fmtDateTime(t.fault.receivedDate)}</div></div>${badge(t.fault.status)}
      </div>`).join("")}
    </div>`;
}
function buildQueueInner(dept){
  const tasks = collectDeptTasks(dept);
  return `
  <div class="max-w col gap3">
    <div class="row gap2">${["نشطة","مكتملة","الكل"].map(f=>`<button class="tab ${deptQueueFilter===f?"active":""}" onclick="setQueueFilter('${f}')">${f}</button>`).join("")}</div>
    <input class="input" placeholder="بحث برقم الأتوبيس أو اسم السائق" value="${esc(queueSearch)}" oninput="queueSetSearch(this.value)"/>
    ${buildQueueResults(tasks)}
  </div>`;
}

/* ===================== كتالوج الخامات ===================== */
function materialsCatalog(){
  const set = new Set(SUPPLY_ITEMS);
  DB.stockAdditions.forEach(s=>(s.items||[]).forEach(it=>{ if(it.name) set.add(it.name); }));
  DB.supplyRequests.forEach(r=>{ if(r.itemName) set.add(r.itemName); });
  DB.buses.forEach(b=>(b.faults||[]).forEach(f=>(f.materials||[]).forEach(m=>{ if(m.name && m.name!=="أخرى") set.add(m.name); })));
  return [...set].sort((a,b)=>a.localeCompare("ar"));
}

function syncWorkDraftFromDOM(){
  if(!workDraft) return;
  const g = id => document.getElementById(id);
  if(g("wf-desc")) workDraft.description = g("wf-desc").value;
  if(g("wf-dept")) workDraft.department = g("wf-dept").value;
  workDraft.spareParts.forEach((r,i)=>{ if(g("wp-name-"+i)) r.name=g("wp-name-"+i).value; if(g("wp-price-"+i)) r.price=g("wp-price-"+i).value; if(g("wp-qty-"+i)) r.qty=g("wp-qty-"+i).value; });
  workDraft.materials.forEach((r,i)=>{ if(g("wm-name-"+i)) r.name=g("wm-name-"+i).value; if(g("wm-custom-"+i)) r.customName=g("wm-custom-"+i).value; if(g("wm-price-"+i)) r.price=g("wm-price-"+i).value; if(g("wm-qty-"+i)) r.qty=g("wm-qty-"+i).value; });
  workDraft.technicians.forEach((r,i)=>{ if(g("wt-name-"+i)) r.name=g("wt-name-"+i).value; if(g("wt-role-"+i)) r.role=g("wt-role-"+i).value; });
  if(g("wf-labor")) workDraft.laborCost = g("wf-labor").value;
  if(g("wf-notes")) workDraft.notes = g("wf-notes").value;
}

  const overlay = document.getElementById("fw-overlay");
  if(overlay) overlay.outerHTML = buildFaultWorkModal(openTask.busId, openTask.faultId);
}
function wpAddRow(){ syncWorkDraftFromDOM(); workDraft.spareParts.push({name:"",price:"",qty:""}); renderWorkModalOnly(); }
function wpRemoveRow(i){ syncWorkDraftFromDOM(); workDraft.spareParts.splice(i,1); renderWorkModalOnly(); }
function wmAddRow(){ syncWorkDraftFromDOM(); workDraft.materials.push({name:"",customName:"",price:"",qty:"",supplyRequestId:null}); renderWorkModalOnly(); }
function wmRemoveRow(i){ syncWorkDraftFromDOM(); workDraft.materials.splice(i,1); renderWorkModalOnly(); }
function wmNameChanged(i, v){ syncWorkDraftFromDOM(); workDraft.materials[i].name = v; renderWorkModalOnly(); }
function wtAddRow(){ syncWorkDraftFromDOM(); workDraft.technicians.push({name:"",role:""}); renderWorkModalOnly(); }
function wtRemoveRow(i){ syncWorkDraftFromDOM(); workDraft.technicians.splice(i,1); renderWorkModalOnly(); }
async function wAddAfterPhotos(input){
  syncWorkDraftFromDOM();
  const files = Array.from(input.files||[]).slice(0, MAX_PHOTOS-workDraft.photosAfter.length);
  for(const file of files){ try{ workDraft.photosAfter.push(await compressImage(file)); }catch(e){} }

function canRequestMaterialRow(row){
  if(!row.supplyRequestId) return true;
  const req = DB.supplyRequests.find(r=>r.id===row.supplyRequestId);
  return !req || req.status===SUPPLY_STATUS.REJECTED;
}
function materialRowRequestBadge(row){
  if(!row.supplyRequestId) return "";
  const req = DB.supplyRequests.find(r=>r.id===row.supplyRequestId);
  if(!req) return "";
  const [c,bg] = supplyStatusColor(req.status);
  return `<span class="badge" style="color:${c};background:${bg};">📦 ${esc(req.status)}</span>`;
}
function requestMaterialFromStore(i){
  syncWorkDraftFromDOM();
  const row = workDraft.materials[i];
  const finalName = row.name==="أخرى" ? (row.customName||"").trim() : (row.name||"").trim();
  if(!finalName){ alert("يرجى اختيار اسم الخامة أولًا"); return; }
  if(!row.qty || Number(row.qty)<=0){ alert("يرجى إدخال كمية صحيحة"); return; }
  const bus = DB.buses.find(b=>b.id===openTask.busId);
  const fault = bus.faults.find(f=>f.id===openTask.faultId);
  const req = {
    id:uid("supply"), itemName:finalName, qty:Number(row.qty), unit:"",
    department: fault.department, requestedByLabel: currentUser.label,
    busId: bus.id, busNumber: bus.busNumber,
    notes: `لمهمة إصلاح: ${fault.description}`.slice(0,150),
    status: SUPPLY_STATUS.PENDING, createdAt: nowISO(),
    decidedAt:null, decidedBy:"", rejectReason:"", dispensedAt:null, dispensedBy:"", recipientName:"",
  };
  touch(req);
  DB.supplyRequests.push(req);
  row.name = finalName; row.customName = ""; row.supplyRequestId = req.id;
  if(!saveDB(DB)) return;
  notifyManagerNewRequest(req);
  wSaveProgress(false);
}

function wStart(){
  const bus = DB.buses.find(b=>b.id===openTask.busId);
  const f = bus.faults.find(x=>x.id===openTask.faultId);
  f.startDate = nowISO(); f.status = FAULT_STATUS.IN_PROGRESS;
  touch(f); touch(bus);
  saveDB(DB); workDraft = JSON.parse(JSON.stringify(f)); renderWorkModalOnly();
}
function wSaveProgress(finish){
  syncWorkDraftFromDOM();
  const bus = DB.buses.find(b=>b.id===openTask.busId);
  const idx = bus.faults.findIndex(x=>x.id===openTask.faultId);
  const updated = {...bus.faults[idx], description:workDraft.description, department:workDraft.department,
    spareParts:workDraft.spareParts, materials:workDraft.materials,
    laborCost:workDraft.laborCost, technicians:workDraft.technicians, photosAfter:workDraft.photosAfter, notes:workDraft.notes};
  if(finish){ updated.endDate = nowISO(); updated.status = FAULT_STATUS.DONE; }
  touch(updated);
  bus.faults[idx] = updated;
  touch(bus);
  if(!saveDB(DB)) return;
  workDraft = JSON.parse(JSON.stringify(updated));
  renderWorkModalOnly();
}

function dvChanged(){

function submitDelivery(){
  const id = document.getElementById("dv-bus").value;
  const approver = document.getElementById("dv-approver").value.trim();
  const confirmed = document.getElementById("dv-confirm").checked;

  if(!bus || !approver || !confirmed){ deliveryMsg="err:يرجى إكمال البيانات والتأكيد"; render(); return; }
  bus.delivery = {driverName:bus.driverName, busNumber:bus.busNumber, deliveryDate: nowISO(), departmentName: busDepts(bus).join("، "), approvedBy:approver, signed:true};

function emptySupplyRequest(){

    notes:"", status:SUPPLY_STATUS.PENDING, createdAt:null,
    decidedAt:null, decidedBy:"", rejectReason:"", dispensedAt:null, dispensedBy:"", recipientName:"", msg:""};
}
function resetSupplyDraft(){ supplyDraft = emptySupplyRequest(); }
function syncSupplyDraftFromDOM(){
  if(!supplyDraft) return;
  const g = id => document.getElementById(id);
  if(g("sr-item")) supplyDraft.itemName = g("sr-item").value;
  if(g("sr-custom")) supplyDraft.customItem = g("sr-custom").value;
  if(g("sr-qty")) supplyDraft.qty = g("sr-qty").value;
  if(g("sr-unit")) supplyDraft.unit = g("sr-unit").value;
  if(g("sr-bus")) supplyDraft.busId = g("sr-bus").value;

function renderSupplyReqOnly(){ const el = document.getElementById("supplyreq-root"); if(el) el.outerHTML = buildSupplyRequestForm(); }

function submitSupplyRequest(){
  syncSupplyDraftFromDOM();
  const d = supplyDraft;
  const finalName = d.itemName==="أخرى" ? d.customItem.trim() : d.itemName;
  if(!finalName){ d.msg = "err:يرجى تحديد اسم الخامة"; renderSupplyReqOnly(); return; }
  if(!d.qty || Number(d.qty)<=0){ d.msg = "err:يرجى إدخال كمية صحيحة"; renderSupplyReqOnly(); return; }
  const bus = d.busId ? DB.buses.find(b=>b.id===d.busId) : null;
  const req = {
    id:uid("supply"), itemName:finalName, qty:Number(d.qty), unit:(d.unit||"").trim(),
    department:currentUser.role, requestedByLabel:currentUser.label,
    busId: bus?bus.id:"", busNumber: bus?bus.busNumber:"",
    notes:(d.notes||"").trim(), status:SUPPLY_STATUS.PENDING, createdAt:nowISO(),
    decidedAt:null, decidedBy:"", rejectReason:"", dispensedAt:null, dispensedBy:"", recipientName:"",
  };
  touch(req);
  DB.supplyRequests.push(req);
  if(!saveDB(DB)) return;
  notifyManagerNewRequest(req);
  resetSupplyDraft();
  supplyDraft.msg = "ok:تم إرسال الطلب ✓";
  renderSupplyReqOnly();
}
function notifyManagerNewRequest(req){
  try{
    if("Notification" in window && Notification.permission==="granted"){
      new Notification("طلب خامات جديد", { body: `${req.itemName} × ${req.qty} — ${req.requestedByLabel}` });
    }
  }catch(e){}
}

function setManagerEmail(v){ DB.settings.managerEmail = v.trim(); saveDB(DB); }
function approveSupplyRequest(id){
  const r = DB.supplyRequests.find(x=>x.id===id); if(!r) return;
  r.status = SUPPLY_STATUS.APPROVED; r.decidedAt = nowISO(); r.decidedBy = currentUser.label;
  touch(r); saveDB(DB); renderSuppliesOnly();
}
function rejectSupplyRequest(id){
  const r = DB.supplyRequests.find(x=>x.id===id); if(!r) return;
  const reason = prompt("سبب الرفض (اختياري):", "") || "";
  r.status = SUPPLY_STATUS.REJECTED; r.decidedAt = nowISO(); r.decidedBy = currentUser.label; r.rejectReason = reason.trim();
  touch(r); saveDB(DB); renderSuppliesOnly();
}
function enableDesktopNotifications(){
  if(!("Notification" in window)){ alert("المتصفح لا يدعم التنبيهات"); return; }
  Notification.requestPermission().then(p=>{
    if(p==="granted") alert("تم التفعيل ✓");
    else alert("لم يتم منح الإذن");
  });
}
function mailtoForRequest(r){
  const email = (DB.settings.managerEmail||"").trim();
  const subject = encodeURIComponent(`طلب صرف خامة: ${r.itemName}`);
  const bodyLines = ["طلب صرف خامة جديد من ورشة الأتوبيسات","",`الخامة: ${r.itemName}`,`الكمية: ${r.qty} ${r.unit||""}`,`القسم: ${r.department}`,`بواسطة: ${r.requestedByLabel}`];
  if(r.busNumber) bodyLines.push(`الأتوبيس: ${r.busNumber}`);
  if(r.notes) bodyLines.push(`ملاحظات: ${r.notes}`);
  bodyLines.push(`التاريخ: ${fmtDateTime(r.createdAt)}`);
  const body = encodeURIComponent(bodyLines.join("\n"));
  return `mailto:${email}?subject=${subject}&body=${body}`;
}
function emailManagerAboutRequest(id){
  const r = DB.supplyRequests.find(x=>x.id===id); if(!r) return;
  if(!DB.settings.managerEmail){ alert("لم يتم تسجيل بريد المدير"); return; }
  window.location.href = mailtoForRequest(r);
}

function computeInventoryBalance(){
  const balance = {};
  DB.stockAdditions.filter(s=>s.status===SUPPLY_STATUS.APPROVED).forEach(s=>{
    s.items.forEach(it=>{
      if(!it.name) return;
      if(!balance[it.name]) balance[it.name] = {qty:0, unit:it.unit||""};
      balance[it.name].qty += Number(it.qty)||0;
      if(it.unit) balance[it.name].unit = it.unit;
    });
  });
  DB.supplyRequests.filter(r=>r.status===SUPPLY_STATUS.DISPENSED).forEach(r=>{
    if(!r.itemName) return;
    if(!balance[r.itemName]) balance[r.itemName] = {qty:0, unit:r.unit||""};
    balance[r.itemName].qty -= Number(r.qty)||0;
    if(r.unit) balance[r.itemName].unit = r.unit;
  });
  return balance;
}

function mergeArraysById(localArr, incomingArr){
  const map = new Map((localArr||[]).map(x=>[x.id,x]));
  let added=0, updated=0;
  (incomingArr||[]).forEach(inc=>{
    const loc = map.get(inc.id);
    if(!loc){ map.set(inc.id, inc); added++; return; }
    const lt = new Date(loc.updatedAt||0).getTime();
    const it = new Date(inc.updatedAt||0).getTime();
    if(it > lt){ map.set(inc.id, inc); updated++; }
  });
  return {list: Array.from(map.values()), added, updated};
}
function mergeBusesArrays(localBuses, incomingBuses, deletedFaultIds){
  const map = new Map((localBuses||[]).map(b=>[b.id,b]));
  let busesAdded=0, busesUpdated=0, faultsAdded=0, faultsUpdated=0;
  (incomingBuses||[]).forEach(incBus=>{
    const cleanFaults = (incBus.faults||[]).filter(f=>!deletedFaultIds[f.id]);
    const locBus = map.get(incBus.id);
    if(!locBus){
      map.set(incBus.id, {...incBus, faults: cleanFaults});
      busesAdded++; faultsAdded += cleanFaults.length;
      return;
    }
    const lt = new Date(locBus.updatedAt||0).getTime();
    const it = new Date(incBus.updatedAt||0).getTime();
    const winnerIsIncoming = it > lt;
    const target = winnerIsIncoming ? {...incBus} : {...locBus};
    if(winnerIsIncoming) busesUpdated++;
    const faultMap = new Map((locBus.faults||[]).map(f=>[f.id,f]));
    cleanFaults.forEach(incF=>{
      const locF = faultMap.get(incF.id);
      if(!locF){ faultMap.set(incF.id, incF); faultsAdded++; return; }
      const flt = new Date(locF.updatedAt||0).getTime();
      const fit = new Date(incF.updatedAt||0).getTime();
      if(fit > flt){ faultMap.set(incF.id, incF); faultsUpdated++; }
    });
    Array.from(faultMap.keys()).forEach(fid=>{ if(deletedFaultIds[fid]) faultMap.delete(fid); });
    target.faults = Array.from(faultMap.values());
    map.set(incBus.id, target);
  });
  return {list: Array.from(map.values()), busesAdded, busesUpdated, faultsAdded, faultsUpdated};
}
function mergeDB(local, incoming){
  const deletedFaultIds = {...(local.meta&&local.meta.deletedFaultIds||{}), ...(incoming.meta&&incoming.meta.deletedFaultIds||{})};
  const busesR = mergeBusesArrays(local.buses, incoming.buses, deletedFaultIds);
  const supR = mergeArraysById(local.supplyRequests, incoming.supplyRequests);
  const stkR = mergeArraysById(local.stockAdditions, incoming.stockAdditions);
  const merged = {buses: busesR.list, supplyRequests: supR.list, stockAdditions: stkR.list,
    settings: local.settings, meta: {deletedFaultIds}};
  const summary = {busesAdded: busesR.busesAdded, busesUpdated: busesR.busesUpdated,
    faultsAdded: busesR.faultsAdded, faultsUpdated: busesR.faultsUpdated,
    supplyAdded: supR.added, supplyUpdated: supR.updated,
    stockAdded: stkR.added, stockUpdated: stkR.updated};
  return {merged, summary};
}
function mergeSyncFile(input){
  const file = input.files[0]; if(!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    try{
      const parsed = JSON.parse(reader.result);
      if(!parsed.buses) throw new Error("bad");
      if(!parsed.supplyRequests) parsed.supplyRequests = [];
      if(!parsed.stockAdditions) parsed.stockAdditions = [];
      if(!parsed.meta) parsed.meta = {deletedFaultIds:{}};
      const fromName = parsed.__syncMeta ? parsed.__syncMeta.deviceName : "جهاز غير معروف";
      const exportedAt = parsed.__syncMeta ? fmtDateTime(parsed.__syncMeta.exportedAt) : "—";
      if(!confirm(`دمج تحديثات من:\n« ${fromName} »\nتاريخ التصدير: ${exportedAt}\n\nدمج آمن (لا يمسح شغلك) — متابعة؟`)) return;
      const {merged, summary} = mergeDB(DB, parsed);
      DB = merged;
      if(!saveDB(DB)) return;
      alert(`تم الدمج ✓\nأتوبيسات جديدة: ${summary.busesAdded} — محدثة: ${summary.busesUpdated}\nمهام جديدة: ${summary.faultsAdded} — محدثة: ${summary.faultsUpdated}\nطلبات جديدة: ${summary.supplyAdded} — محدثة: ${summary.supplyUpdated}\nمستندات جديدة: ${summary.stockAdded} — محدثة: ${summary.stockUpdated}`);
      render();
    }catch(e){ alert("ملف مزامنة غير صالح"); }
  };
  reader.readAsText(file);
  input.value = "";
}

/* ===================== مؤشر مساحة التخزين ===================== */
async function refreshStorageUsageOnly(){
  const el = document.getElementById("storage-usage-box");
  if(!el) return;
  if(!navigator.storage || !navigator.storage.estimate){ el.innerHTML = ""; return; }
  try{
    const {usage, quota} = await navigator.storage.estimate();
    if(!quota){ el.innerHTML = ""; return; }
    const pct = Math.min(100, Math.round((usage/quota)*100));
    el.innerHTML = buildStorageUsageBar(usage, quota, pct);
  }catch(e){ el.innerHTML = ""; }
}
function buildStorageUsageBar(usage, quota, pct){
  const mb = n => (n/1024/1024).toFixed(1);
  const color = pct>85 ? "var(--red)" : (pct>60 ? "var(--amber)" : "var(--green)");
  return `<div class="col gap1">
    <div class="row between wrap gap1 txt-xs sub"><span>مساحة التخزين المستخدمة</span><span class="bold" style="color:${color}">${mb(usage)} م.ب من ${mb(quota)} م.ب (${pct}%)</span></div>
    <div class="bar-outer"><div class="bar-inner" style="width:${pct}%;background:${color};"></div></div>
    ${pct>80?`<p class="txt-xs" style="color:var(--red);">⚠ المساحة قربت تخلص</p>`:""}
  </div>`;
}
function purgeOldDeliveredPhotos(){
  const daysStr = prompt("مسح صور الأتوبيسات المُسلَّمة من أكتر من كام يوم؟", "14");
  if(daysStr===null) return;
  const days = Number(daysStr);
  if(!days || days<=0){ alert("رقم أيام غير صحيح"); return; }
  const cutoff = Date.now() - days*24*60*60*1000;
  let photoCount = 0, busCount = 0;
  DB.buses.forEach(b=>{
    if(!b.delivery) return;
    const deliveredAt = new Date(b.delivery.deliveryDate).getTime();
    if(isNaN(deliveredAt) || deliveredAt > cutoff) return;
    let touchedBus = false;
    (b.faults||[]).forEach(f=>{
      const n = (f.photosBefore||[]).length + (f.photosAfter||[]).length;
      if(n>0){ photoCount += n; f.photosBefore = []; f.photosAfter = []; touch(f); touchedBus = true; }
    });
    if(touchedBus){ touch(b); busCount++; }
  });
  if(photoCount===0){ alert("لا توجد صور لتفريغها"); return; }
  if(!confirm(`سيتم حذف ${photoCount} صورة من ${busCount} أتوبيس. متابعة؟`)) return;
  if(!saveDB(DB)) return;
  alert("تم التفريغ ✓");
  render();
}

    <p class="rfault-title">مهمة ${i+1} — ${esc(f.department)} — ${esc(f.status)}</p>
    <p><span class="rlabel">الوصف:</span> ${esc(f.description)}</p>
    ${f.notes ? `<p><span class="rlabel">ملاحظات:</span> ${esc(f.notes)}</p>` : ""}
    <p class="rdates">استلام: ${fmtDateTime(f.receivedDate)} · بداية: ${fmtDateTime(f.startDate)} · انتهاء: ${fmtDateTime(f.endDate)}</p>
    ${(f.technicians&&f.technicians.filter(t=>t.name).length) ? `<p><span class="rlabel">الفنيون:</span> ${f.technicians.filter(t=>t.name).map(t=>esc(t.name)+(t.role?" ("+esc(t.role)+")":"")).join("، ")}</p>` : ""}
    ${(f.photosBefore&&f.photosBefore.length) ? `<p class="rlabel">صور قبل الإصلاح:</p><div class="rphotos">${f.photosBefore.map(p=>`<img src="${p}"/>`).join("")}</div>` : ""}
    ${(f.photosAfter&&f.photosAfter.length) ? `<p class="rlabel">صور بعد الإصلاح:</p><div class="rphotos">${f.photosAfter.map(p=>`<img src="${p}"/>`).join("")}</div>` : ""}
    ${rowsTable("قطع الغيار", (f.spareParts||[]).filter(p=>p.name))}
    ${rowsTable("الخامات", (f.materials||[]).filter(m=>m.name))}
    <p><span class="rlabel">المصنعية:</span> ${fmtMoney(f.laborCost)}</p>
    <p class="rfault-total">إجمالي المهمة: ${fmtMoney(faultTotal(f))}</p>
  </div>`;
}
function buildBusDetailedReportBlock(bus){
  return `
  <div class="rbus">
    <h2>أتوبيس ${esc(bus.busNumber)} — السائق: ${esc(bus.driverName)} ${bus.driverCode?`(كود: ${esc(bus.driverCode)})`:""}</h2>
    <p class="rmeta">المفتش: ${esc(bus.inspectorName)} · التفتيش: ${fmtDateTime(bus.inspectionDate)} · الحالة: ${esc(computeBusStatus(bus))}</p>
    ${(bus.faults||[]).map((f,i)=>buildFaultDetailBlock(f,i)).join("")}
    ${bus.delivery ? `<p class="rdelivery">✔ تم التسليم للسائق ${esc(bus.delivery.driverName)} بتاريخ ${fmtDateTime(bus.delivery.deliveryDate)} — اعتمد بواسطة ${esc(bus.delivery.approvedBy)}</p>` : ""}
    <p class="rbus-total">إجمالي الأتوبيس: ${fmtMoney(busTotalCost(bus))}</p>
  </div>`;
}
const DETAILED_REPORT_CSS = `
    body{font-family:Tahoma,Arial,"Segoe UI",sans-serif;color:#111;padding:24px;max-width:900px;margin:0 auto;}
    h1{font-size:20px;margin-bottom:2px;}
    .rsub{color:#666;font-size:12px;margin-bottom:20px;}
    .rbus{margin-bottom:26px;padding-bottom:18px;border-bottom:2px solid #333;page-break-inside:avoid;}
    .rbus h2{font-size:16px;margin:0 0 4px;}
    .rmeta{font-size:12px;color:#555;margin:0 0 12px;}
    .rfault{margin:10px 0;padding:10px 12px;border:1px solid #ccc;border-radius:8px;background:#fafafa;page-break-inside:avoid;}
    .rfault-title{font-weight:bold;margin:0 0 6px;}
    .rlabel{font-weight:bold;color:#444;font-size:12px;display:inline;}
    .rdates{font-size:11px;color:#666;margin:6px 0;}
    .rphotos{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 10px;}
    .rphotos img{width:100px;height:100px;object-fit:cover;border-radius:6px;border:1px solid #bbb;}
    table{width:100%;border-collapse:collapse;margin:6px 0 10px;font-size:11.5px;}
    td,th{border:1px solid #ccc;padding:4px 6px;text-align:right;}
    th{background:#eee;}
    .rfault-total{font-weight:bold;text-align:left;margin:6px 0 0;}
    .rbus-total{font-weight:bold;text-align:left;font-size:14px;margin-top:8px;}
    .rdelivery{font-size:12px;color:#1a7a4c;margin-top:8px;}
    .rgrand{font-size:16px;font-weight:bold;text-align:left;margin-top:10px;padding-top:10px;border-top:2px solid #333;}
    @media print{ body{padding:10px;} }`;
function buildDetailedReportBody(buses){
  const grandTotal = buses.reduce((s,b)=>s+busTotalCost(b),0);
  return `
    <h1>🔧 تقرير تفصيلي — ورشة الأتوبيسات</h1>
    <p class="rsub">تاريخ الإصدار: ${fmtDateTime(nowISO())} — عدد الأتوبيسات: ${buses.length}</p>
    ${buses.map(buildBusDetailedReportBlock).join("")}
    <p class="rgrand">الإجمالي الكلي: ${fmtMoney(grandTotal)}</p>`;
}
function printDetailedReport(buses){
  buses = (buses||[]).filter(Boolean);
  if(buses.length===0){ alert("لا توجد أتوبيسات لعرض تقرير عنها"); return; }
  const html = `<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"/><title>تقرير تفصيلي</title><style>${DETAILED_REPORT_CSS}</style></head><body>${buildDetailedReportBody(buses)}</body></html>`;
  const win = window.open("", "_blank");
  if(!win){ alert("يرجى السماح بفتح النوافذ المنبثقة"); return; }
  win.document.write(html); win.document.close();
  win.onload = () => { win.focus(); win.print(); };
}
function downloadWordReport(buses, filename){
  buses = (buses||[]).filter(Boolean);
  if(buses.length===0){ alert("لا توجد أتوبيسات لعرض تقرير عنها"); return; }
  const html = `<html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:w="urn:schemas-microsoft-com:office:word" xmlns="http://www.w3.org/TR/REC-html40">
  <head><meta charset="UTF-8"/><title>تقرير تفصيلي</title>
  <!--[if gte mso 9]><xml><w:WordDocument><w:View>Print</w:View><w:Zoom>100</w:Zoom></w:WordDocument></xml><![endif]-->
  <style>${DETAILED_REPORT_CSS}</style></head>
  <body dir="rtl">${buildDetailedReportBody(buses)}</body></html>`;
  const blob = new Blob(["\ufeff"+html], {type:"application/msword;charset=utf-8"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = filename || ("تقرير-تفصيلي-"+new Date().toISOString().slice(0,10)+".doc");
  a.click(); URL.revokeObjectURL(url);
}
function reportRows(){
  const rows = [["رقم الأتوبيس","السائق","الحالة","الأقسام","عدد الأعمال","المكتمل","إجمالي التكلفة","تاريخ التفتيش"]];
  DB.buses.forEach(b=>{
    rows.push([b.busNumber,b.driverName,computeBusStatus(b),busDepts(b).join(" / "),b.faults.length,
      b.faults.filter(f=>f.status===FAULT_STATUS.DONE).length, busTotalCost(b), fmtDateTime(b.inspectionDate)]);
  });
  return rows;
}

async function bootApp(){
  // 1. حمّل البيانات المحلية أولاً (سرعة + شغل بدون نت)
  try{
    DB = await loadLocalDB();
  }catch(e){ DB = normalizeDB({}); }
  // 2. حاول ترمي المحلي للسحابة لو السحابة فاضية (يتم التعامل معه في onCloudDataReceived)
  // 3. استرجع الجلسة واعرض
  restoreLoginSession();
  render();
}

bootApp();
